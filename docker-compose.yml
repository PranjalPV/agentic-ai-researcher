version: '3.8'

services:
  ui:
    build: .
    container_name: agentic_researcher_ui
    command: streamlit run ui.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped

  api:
    build: .
    container_name: agentic_researcher_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
    restart: unless-stopped
